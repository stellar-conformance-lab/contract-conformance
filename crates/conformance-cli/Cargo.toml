[package]
name = "conformance-cli"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "stellar-conform"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4.18", features = ["derive"] }
conformance-core = { path = "../conformance-core" }
conformance-sep41 = { path = "../conformance-sep41" }
conformance-report = { path = "../conformance-report" }
fixture-valid = { path = "../../fixtures/valid" }
soroban-sdk = { version = "28.0.0", features = ["testutils"] }
