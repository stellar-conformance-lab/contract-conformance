name: Action Integration Tests
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Action (Root Default)
        uses: ./
  
  test-explicit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Action (Explicit)
        uses: ./
        with:
          profile: sep-41
  
  test-failure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run CLI directly to test failure propagation
        run: |
          if cargo run -p conformance-cli -- test --profile unknown; then
            echo "Expected failure but CLI succeeded"
            exit 1
          else
            echo "CLI correctly failed on invalid profile."
          fi
